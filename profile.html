<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <div class="profile-container">

        <div class="profile-header">
            <h1>Employer Profile</h1>
            <p>Manage your company profile</p>
        </div>

        <div class="profile-card">

            <h2>Profile Details</h2>

            <form id="profileForm">

                <div class="form-group">
                    <label>Employer Name</label>
                    <input type="text" value="Employer">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" value="employer@gmail.com">
                </div>

                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" value="ABC Technologies">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" value="Chennai">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" value="9876543210">
                </div>

                <div class="form-group full-width">
                    <label>About Company</label>
                    <textarea rows="5">ABC Technologies is a software company providing innovative technology solutions.</textarea>
                </div>

                <button type="submit">Update Profile</button>

            </form>

        </div>

        <a class="back-link" href="dashboard.html">← Back to Dashboard</a>

    </div>

    <script>
        document.getElementById("profileForm").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Profile updated successfully!");
        });
    </script>

</body>
</html>
